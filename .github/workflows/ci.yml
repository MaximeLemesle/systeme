name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server-tests:
    name: Serveur — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Valeurs factices : aucune ressource réelle n'est contactée pendant les tests.
      JWT_SECRET: ci-test-secret
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  client-build:
    name: Client — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
